<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Super Mario Pro - Phaser 3 Engine</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h2 { margin-bottom: 15px; color: #ffcc00; text-transform: uppercase; font-size: 1.2rem; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,204,0,0.3); }
        #game-wrapper {
            border: 4px solid #fff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            background-color: #000;
        }
        .instruction { margin-top: 15px; color: #94a3b8; font-size: 0.85rem; text-align: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

    <h2>Mario Phaser Engine Pro</h2>
    <div id="game-wrapper">
        <div id="phaser-game"></div>
    </div>
    <div class="instruction">PC: Phím Mũi Tên để di chuyển | Mobile: Chạm nửa trái/phải để đi, nửa trên để nhảy</div>

    <script>
        // Dữ liệu hình ảnh Base64 được tối ưu hóa để tự vẽ texture sắc nét trong game
        const assets = {
            mario: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAgCAYAAAALg507AAAAAXNSR0IArs4c6QAAAExJREFUSEtjejQMDPyD0fBwMJA9ZID6mAGmD0I08P9wMJB6bID8UANMvxG0bMAwGvj/g9FwRjWUYTSQUQ1lGA1kVEMZRvXAoTSQEAMA4iUkEVwFm78AAAAASUVORK5CYII=', // Khối nhân vật
            goomba: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAAXNSR0IArs4c6QAAADFJREFUOE9jPMDAcJiBAsA4VA00MFAZDA0MVAZDAwOVwdDAQGUwNDBQGQwNDFQGg8YAAOnpAhGfG6YhAAAAAElFTkSuQmCC', // Khối quái nấm
            ground: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAADNJREFUWEft0rENwAAAwzC6/6LtG67pYAEG9O4wO9K6Wf7fAAsWLFiwYMGChW8WvFmcoAAL/u89EfP9/AAAAABJRU5ErkJggg==', // Khối đất kết cấu
            brick: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAADRJREFUWEft0rENwAAAxDC6/6LtG67pQAAGdLg7zI60bpb/N8CCBQsWLFiwYOGbBW8WJyjAgv8bORHz/fMAAAAASUVORK5CYII='  // Khối gạch đỏ
        };

        // Cấu hình hệ thống của Game Engine
        const config = {
            type: Phaser.AUTO,
            width: 640,
            height: 360,
            parent: 'phaser-game',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 1000 }, // Trọng lực vật lý mượt mà
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let player;
        let cursors;
        let platforms;
        let enemies;
        let particles;
        let score = 0;
        let scoreText;
        let gameOver = false;

        // 1. TẢI TÀI NGUYÊN (PRELOAD)
        function preload() {
            this.load.image('mario', assets.mario);
            this.load.image('goomba', assets.goomba);
            this.load.image('ground', assets.ground);
            this.load.image('brick', assets.brick);
        }

        // 2. KHỞI TẠO THẾ GIỚI GAME (CREATE)
        function create() {
            // Thiết lập bầu trời có hiệu ứng Gradient đẹp mắt thông qua đồ họa của Phaser
            let sky = this.add.graphics();
            sky.fillGradientStyle(0x5c94fc, 0x5c94fc, #b7d1ff, #b7d1ff, 1);
            sky.fillRect(0, 0, 3000, 360);

            // Tạo nhóm vật thể tĩnh (Địa hình có va chạm)
            platforms = this.physics.add.staticGroup();

            // Thiết kế bản đồ nâng cao: Đất liền, Vực thẳm, Khối hộp gạch
            // Vẽ nền mặt đất
            for (let x = 0; x < 900; x += 32) platforms.create(x, 344, 'ground').setTint(0xfc9838).refreshBody();
            for (let x = 1050; x < 1800; x += 32) platforms.create(x, 344, 'ground').setTint(0xfc9838).refreshBody();
            for (let x = 1950; x < 2600; x += 32) platforms.create(x, 344, 'ground').setTint(0xfc9838).refreshBody();

            // Vẽ các bậc thang gạch lơ lửng chuyên nghiệp
            let brickLocations = [
                {x: 250, y: 240}, {x: 282, y: 240}, {x: 314, y: 240},
                {x: 600, y: 200}, {x: 632, y: 200},
                {x: 1200, y: 220}, {x: 1232, y: 220}, {x: 1500, y: 160}
            ];
            brickLocations.forEach(loc => {
                platforms.create(loc.x, loc.y, 'brick').setTint(0xc84c0c).refreshBody();
            });

            // Tạo nhân vật Mario với hiệu ứng vật lý cao cấp
            player = this.physics.add.sprite(80, 200, 'mario').setTint(0xfc2c00);
            player.setCollideWorldBounds(false); // Cho phép rơi xuống vực tự do
            player.setBounce(0.05); // Độ nảy nhẹ khi tiếp đất
            player.body.setGravityY(200);

            // Tạo hiệu ứng hạt bụi đất khi di chuyển chân thực
            particles = this.add.particles(0, 0, 'ground', {
                speed: { min: -50, max: 50 },
                angle: { min: 0, max: 360 },
                scale: { start: 0.1, end: 0 },
                blendMode: 'ADD',
                lifespan: 300,
                gravityY: 100,
                emitting: false
            });

            // Tạo danh sách Quái vật tuần tra
            enemies = this.physics.add.group();
            let enemyLocs = [450, 750, 1350, 1650, 2100];
            enemyLocs.forEach(ex => {
                let goomba = enemies.create(ex, 300, 'goomba').setTint(0xa84400);
                goomba.setVelocityX(-80);
                goomba.setCollideWorldBounds(false);
                goomba.body.setBounceX(1); // Tự quay đầu khi đụng chướng ngại vật
            });

            // Thiết lập va chạm cơ học giữa các thực thể
            this.physics.add.collider(player, platforms);
            this.physics.add.collider(enemies, platforms);
            
            // Xử lý va chạm giữa Mario và Quái vật bằng hàm tùy biến
            this.physics.add.overlap(player, enemies, hitEnemy, null, this);

            // Thiết lập Camera chuyên nghiệp - Khóa trục Y, Cuộn mượt trục X theo nhân vật
            this.cameras.main.setBounds(0, 0, 2600, 360);
            this.physics.world.setBounds(0, 0, 2600, 360);
            this.cameras.main.startFollow(player, true, 0.1, 0, -100, 50);

            // Giao diện hiển thị điểm số cố định trên màn hình (Hỗ trợ đổ bóng Neon)
            scoreText = this.add.text(20, 20, 'SCORE: 000000', { 
                fontSize: '20px', 
                fill: '#fff', 
                fontFamily: 'Courier New',
                fontWeight: 'bold'
            }).setScrollFactor(0);
            scoreText.setShadow(2, 2, 'rgba(0,0,0,0.5)', 2);

            // Khởi tạo trình đọc sự kiện bàn phím PC
            cursors = this.input.keyboard.createCursorKeys();

            // Hỗ trợ thiết bị di động cảm ứng thông minh
            this.input.on('pointerdown', function (pointer) {
                if (gameOver) { this.scene.restart(); gameOver = false; score = 0; return; }
                
                if (pointer.y < 180 && player.body.touching.down) {
                    player.setVelocityY(-420); // Chạm nửa trên màn hình để nhảy
                } else if (pointer.x < window.innerWidth / 2) {
                    player.setVelocityX(-180); // Chạm nửa trái để lùi
                } else {
                    player.setVelocityX(180);  // Chạm nửa phải để tiến
                }
            }, this);
        }

        // 3. XỬ LÝ LOGIC TRONG TỪNG KHUNG HÌNH (UPDATE - 60 FPS)
        function update() {
            if (gameOver) return;

            // Di chuyển bằng bàn phím PC kết hợp hiệu ứng tạo bụi hạt
            if (cursors.left.isDown) {
                player.setVelocityX(-180);
                if(player.body.touching.down) {
                    particles.emitParticleAt(player.x, player.y + 16, 1);
                }
            } else if (cursors.right.isDown) {
                player.setVelocityX(180);
                if(player.body.touching.down) {
                    particles.emitParticleAt(player.x, player.y + 16, 1);
                }
            } else {
                // Tạo lực ma sát hãm phanh từ từ cho chuyển động chân thực hơn
                player.setVelocityX(player.body.velocity.x * 0.8);
            }

            // Nhảy lên mượt mà có tính toán độ cao trần vật lý
            if ((cursors.up.isDown || cursors.space.isDown) && player.body.touching.down) {
                player.setVelocityY(-430);
            }

            // Đồng bộ hướng di chuyển của quái vật tuần tra tự động
            enemies.children.iterate(function (goomba) {
                if (goomba && goomba.body.touching.left) {
                    goomba.setVelocityX(80);
                } else if (goomba && goomba.body.touching.right) {
                    goomba.setVelocityX(-80);
                }
            });

            // Tự động kiểm tra điều kiện Rơi xuống vực sâu -> Game Over
            if (player.y > 360) {
                executeGameOver(this);
            }

            // Kiểm tra điều kiện Cán Đích Chiến Thắng (Vượt qua mốc tọa độ x = 2400)
            if (player.x > 2400) {
                executeWin(this);
            }
        }

        // Hàm xử lý va chạm thông minh với quái vật
        function hitEnemy(player, enemy) {
            // Nếu Mario đang rơi từ trên xuống đầu quái
            if (player.body.velocity.y > 0 && player.y + 10 < enemy.y) {
                // Kích hoạt hiệu ứng vụ nổ sao lấp lánh khi giẫm chết quái
                let emitter = this.add.particles(enemy.x, enemy.y, 'brick', {
                    speed: 120, scale: { start: 0.2, end: 0 }, lifespan: 400, quantity: 10, emitting: false
                });
                emitter.explode();

                enemy.destroy(); // Xóa sổ quái vật
                player.setVelocityY(-280); // Nảy giật ngược người lên lại
                score += 200;
                scoreText.setText('SCORE: ' + String(score).padStart(6, '0'));
            } else {
                // Ngược lại, đụng cạnh bên -> Thua trận
                executeGameOver(this);
            }
        }

        // Hàm kết thúc trò chơi (Thua cuộc)
        function executeGameOver(scene) {
            if (gameOver) return;
            gameOver = true;
            player.setVelocity(0, -300); // Hiệu ứng Mario văng lên trời khi thua
            player.setTint(0x475569);
            
            let txt = scene.add.text(320, 160, 'GAME OVER', { 
                fontSize: '40px', fill: '#ff2c00', fontFamily: 'Courier New', fontWeight: 'bold' 
            }).setOrigin(0.5).setScrollFactor(0);
            txt.setShadow(3, 3, '#000', 4);

            let subTxt = scene.add.text(320, 210, 'Nhấp chuột hoặc chạm để chơi lại', { 
                fontSize: '14px', fill: '#fff', fontFamily: 'Courier New' 
            }).setOrigin(0.5).setScrollFactor(0);
            
            scene.input.on('pointerdown', () => { scene.scene.restart(); gameOver = false; score = 0; });
        }

        // Hàm kết thúc trò chơi (Chiến thắng)
        function executeWin(scene) {
            if (gameOver) return;
            gameOver = true;
            player.setVelocity(0, 0);
            player.setTint(0xffcc00);

            let txt = scene.add.text(320, 160, 'VICTORY! YOU WIN', { 
                fontSize: '36px', fill: '#ffcc00', fontFamily: 'Courier New', fontWeight: 'bold' 
            }).setOrigin(0.5).setScrollFactor(0);
            txt.setShadow(3, 3, '#000', 4);
        }
    </script>
</body>
</html>
