<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Retro Mario Pro - Github Pages</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h2 { margin: 5px 0; color: #ffcc00; text-transform: uppercase; font-size: 1rem; letter-spacing: 2px; }
        
        #game-container {
            position: relative;
            background: #5c94fc; /* Bầu trời */
            border: 5px solid #fff;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.1);
        }

        canvas { display: block; border-radius: 6px; }

        /* Nút điều khiển Mobile đẹp hơn */
        .mobile-controls {
            display: none;
            width: 100%;
            max-width: 600px;
            justify-content: space-between;
            padding: 15px;
            position: absolute;
            bottom: 10px;
            z-index: 10;
        }
        .btn-group { display: flex; gap: 15px; }
        .ctrl-btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .ctrl-btn:active { background: rgba(255, 255, 255, 0.5); transform: translateY(2px); }

        @media (max-width: 768px) {
            .mobile-controls { display: flex; }
            #game-container { margin-bottom: 90px; }
        }
    </style>
</head>
<body>

    <h2>Mario Retro Pro - Đồ họa 2.0</h2>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="350"></canvas>
    </div>

    <div class="mobile-controls">
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="ctrl-btn" id="btn-jump">▲</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Cấu hình vật lý nâng cao
        const GRAVITY = 0.5;
        const JUMP_FORCE = -11.5; // Nhảy cao hơn một chút cho mượt
        const SPEED = 4;
        let gameStatus = "PLAYING"; 
        let score = 0;

        // Mario được nâng cấp đồ họa
        const mario = {
            x: 50, y: 200,
            width: 28, height: 36, // To hơn chút
            vx: 0, vy: 0,
            grounded: false,
            facing: "right",
            state: "idle" // idle, running, jumping
        };

        const camera = { x: 0 };
        const keys = { left: false, right: false, up: false };

        // Bản đồ (có vực thẳm và độ phức tạp hơn)
        const platforms = [
            { x: 0, y: 310, w: 700, h: 40, type: 'g' },
            { x: 800, y: 310, w: 300, h: 40, type: 'g' }, 
            { x: 1250, y: 310, w: 1000, h: 40, type: 'g' }, // Vực thẳm 700-800 và 1100-1250
            
            // Khối gạch chi tiết
            { x: 200, y: 220, w: 32, h: 32, type: 'b' },
            { x: 232, y: 220, w: 32, h: 32, type: 'b' },
            { x: 264, y: 220, w: 32, h: 32, type: 'b' },
            
            // Ống nước chi tiết
            { x: 450, y: 250, w: 48, h: 60, type: 'p' }, 
            { x: 650, y: 210, w: 48, h: 100, type: 'p' }, 

            { x: 900, y: 230, w: 100, h: 20, type: 'b' },
            { x: 1400, y: 230, w: 120, h: 20, type: 'b' },
            { x: 1600, y: 150, w: 100, h: 20, type: 'b' },
            
            // Cột cờ đẹp hơn
            { x: 1950, y: 110, w: 12, h: 200, type: 'f' }
        ];

        // Quái được nâng cấp
        const enemies = [
            { x: 350, y: 282, w: 28, h: 28, vx: -1.5, alive: true, type: 'goomba', dy: 0 },
            { x: 950, y: 282, w: 28, h: 28, vx: -1.5, alive: true, type: 'goomba', dy: 0 },
            { x: 1500, y: 282, w: 28, h: 28, vx: -1.2, alive: true, type: 'goomba', dy: 0 }
        ];

        // PC Controls
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
            if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
            if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.up = true;
            if (gameStatus !== "PLAYING" && (e.key === "r" || e.key === "Enter")) resetGame();
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
            if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
            if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.up = false;
        });

        // Mobile Controls
        const setupMobileButton = (id, keyName) => {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
        };
        setupMobileButton("btn-left", "left");
        setupMobileButton("btn-right", "right");
        setupMobileButton("btn-jump", "up");
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); if(gameStatus !== "PLAYING") resetGame(); });

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.w &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.h &&
                   obj1.y + obj1.height > obj2.y;
        }

        function resetGame() {
            mario.x = 50; mario.y = 200; mario.vx = 0; mario.vy = 0;
            camera.x = 0; score = 0; gameStatus = "PLAYING";
            enemies.forEach(en => { en.alive = true; en.x = en.x; en.dy = 0; });
        }

        function update() {
            if (gameStatus !== "PLAYING") return;

            // Xử lý chuyển động và state
            if (keys.left) {
                mario.vx = -SPEED; mario.facing = "left"; mario.state = "running";
            } else if (keys.right) {
                mario.vx = SPEED; mario.facing = "right"; mario.state = "running";
            } else {
                mario.vx = 0; mario.state = "idle";
            }

            if (!mario.grounded) mario.state = "jumping";

            if (keys.up && mario.grounded) {
                mario.vy = JUMP_FORCE;
                mario.grounded = false;
                mario.state = "jumping";
            }

            mario.vy += GRAVITY;
            mario.x += mario.vx;
            if (mario.x < 0) mario.x = 0;

            platforms.forEach(p => {
                if (checkCollision(mario, p) && p.type !== 'f') {
                    if (mario.vx > 0) mario.x = p.x - mario.width;
                    if (mario.vx < 0) mario.x = p.x + p.w;
                }
            });

            mario.y += mario.vy;
            mario.grounded = false;

            platforms.forEach(p => {
                if (checkCollision(mario, p)) {
                    if (p.type === 'f') { gameStatus = "WIN"; return; }
                    if (mario.vy > 0) { 
                        mario.y = p.y - mario.height; mario.vy = 0; mario.grounded = true;
                    } else if (mario.vy < 0) { 
                        mario.y = p.y + p.h; mario.vy = 0;
                    }
                }
            });

            enemies.forEach(en => {
                if (!en.alive) return;
                en.x += en.vx;

                platforms.forEach(p => {
                    if (p.type !== 'f' && checkCollision({x: en.x, y: en.y, width: en.w, height: en.h}, p)) {
                        en.vx *= -1; // Quái quay đầu nếu đụng gạch/ống
                        en.x += en.vx * 2; // Đẩy ra chút
                    }
                });

                if (checkCollision(mario, {x: en.x, y: en.y, w: en.w, h: en.h})) {
                    // Nếu Mario giẫm lên đầu Quái
                    if (mario.vy > 0 && mario.y + mario.height - mario.vy <= en.y + 12) {
                        en.alive = false;
                        score += 100;
                        mario.vy = JUMP_FORCE / 1.6;
                        en.dy = JUMP_FORCE / 2; // Hiệu ứng quái nảy lên nhẹ khi chết
                    } else {
                        gameStatus = "GAMEOVER";
                    }
                }
            });

            if (mario.y > canvas.height) { gameStatus = "GAMEOVER"; }

            if (mario.x > canvas.width / 2) { camera.x = mario.x - canvas.width / 2; }
        }

        // --- CÁC HÀM VẼ GIẢ PIXEL ART ĐẸP HƠN ---

        function drawMario(ctx, m) {
            const x = m.x, y = m.y;
            
            // Mũ
            ctx.fillStyle = "#fc2c00"; 
            ctx.fillRect(x + 4, y, m.width - 8, 8); 
            ctx.fillRect(x, y + 4, 8, 4); 

            // Tóc/Râu
            ctx.fillStyle = "#a84400"; 
            ctx.fillRect(x, y + 8, 4, 12);
            ctx.fillRect(x + 4, y + 12, m.width - 12, 4);

            // Da
            ctx.fillStyle = "#fca044"; 
            ctx.fillRect(x + 4, y + 8, m.width - 12, 8); 
            ctx.fillRect(x, y + 12, 4, 4);

            // Thân/Áo đỏ
            ctx.fillStyle = "#fc2c00"; 
            ctx.fillRect(x + 6, y + 20, m.width - 12, 10);

            // Quần yếm
            ctx.fillStyle = "#a84400"; 
            ctx.fillRect(x + 2, y + 20, 4, 16); 
            ctx.fillRect(x + m.width - 6, y + 20, 4, 16);
            ctx.fillRect(x + 2, y + 30, m.width - 4, 6);
            
            // Giày
            ctx.fillStyle = "#6b3c10"; 
            ctx.fillRect(x, y + 34, 8, 2); 
            ctx.fillRect(x + m.width - 8, y + 34, 8, 2);
        }

        function drawBrick(ctx, p) {
            ctx.fillStyle = "#c84c0c"; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#fc9838"; 
            ctx.fillRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4);
            ctx.fillStyle = "#000"; // Họa tiết gạch
            ctx.fillRect(p.x + 10, p.y + 8, 4, 4);
            ctx.fillRect(p.x + p.w - 14, p.y + p.h - 12, 4, 4);
        }

        function drawPipe(ctx, p) {
            // Thân ống đẹp hơn với viền và bóng
            ctx.fillStyle = "#00a800"; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeStyle = "#004400"; ctx.lineWidth = 3; ctx.strokeRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#00fc00"; ctx.fillRect(p.x + 3, p.y, 6, p.h);
            // Miệng ống
            ctx.fillStyle = "#00fc00"; ctx.fillRect(p.x - 6, p.y, p.w + 12, 20);
            ctx.strokeStyle = "#004400"; ctx.lineWidth = 3; ctx.strokeRect(p.x - 6, p.y, p.w + 12, 20);
        }

        function drawGround(ctx, p) {
            ctx.fillStyle = "#fc9838"; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#00a800"; ctx.fillRect(p.x, p.y, p.w, 8); // Phủ cỏ
            ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y + 12, p.w, 1); // Họa tiết đất
        }

        function drawGoomba(ctx, en) {
            if(!en.alive) {
                ctx.fillStyle = "rgba(168, 68, 0, 0.5)"; // Quái chết trong mờ
                ctx.fillRect(en.x, en.y + 10, en.w, en.h - 10);
                return;
            }
            // Đầu nấm
            ctx.fillStyle = "#a84400"; ctx.fillRect(en.x, en.y, en.w, 20);
            // Thân/Chân
            ctx.fillStyle = "#fff"; ctx.fillRect(en.x + 6, en.y + 20, 16, 8);
            ctx.fillStyle = "#000"; 
            ctx.fillRect(en.x + 4, en.y + 24, 6, 4); ctx.fillRect(en.x + en.w - 10, en.y + 24, 6, 4); // Chân
            ctx.fillRect(en.x + 6, en.y + 6, 4, 6); ctx.fillRect(en.x + en.w - 10, en.y + 6, 4, 6); // Mắt
        }

        function draw() {
            // Xóa trời
            ctx.fillStyle = "#5c94fc"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-camera.x, 0);

            // Vẽ vật thể chi tiết
            platforms.forEach(p => {
                if (p.type === 'g') drawGround(ctx, p);
                else if (p.type === 'b') drawBrick(ctx, p);
                else if (p.type === 'p') drawPipe(ctx, p);
                else if (p.type === 'f') {
                    ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y, p.w, p.h); // Thân cột
                    ctx.fillStyle = "#fc2c00"; ctx.fillRect(p.x - 22, p.y, 22, 16); // Lá cờ
                }
            });

            // Vẽ quái
            enemies.forEach(en => {
                if(!en.alive && en.dy !== 0) { // Hiệu ứng quái nảy nhẹ khi chết
                    en.dy += GRAVITY; en.y += en.dy;
                }
                drawGoomba(ctx, en);
            });

            // Vẽ Mario
            drawMario(ctx, mario);

            ctx.restore();

            // UI
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(10, 10, 180, 45); // Khung điểm nền mờ
            ctx.fillStyle = "#ffcc00"; ctx.font = "bold 16px 'Courier New'"; ctx.fillText(`SCORE: ${score}`, 25, 30);
            ctx.fillStyle = "#fff"; ctx.font = "14px 'Courier New'"; ctx.fillText(`MARIO`, 25, 48);

            // End Screen mượt hơn
            if (gameStatus === "GAMEOVER") {
                ctx.fillStyle = "rgba(15, 23, 42, 0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff2c00"; ctx.font = "bold 32px 'Courier New'"; ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillStyle = "#fff"; ctx.font = "bold 14px 'Courier New'";
                ctx.fillText("Nhấn 'R' hoặc Chạm màn hình để THỬ LẠI", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "start";
            } else if (gameStatus === "WIN") {
                ctx.fillStyle = "rgba(15, 23, 42, 0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffcc00"; ctx.font = "bold 32px 'Courier New'"; ctx.textAlign = "center";
                ctx.fillText("YOU WIN! VICTORY!", canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillStyle = "#fff"; ctx.font = "bold 14px 'Courier New'";
                ctx.fillText("Chúc mừng! Bạn đã chinh phục Retro Mario Pro.", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "start";
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
